<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Event Evidence</title>

    <style>

        body {

            margin: 0;

            font-family: Arial, sans-serif;

            background: #f5f6fa;

            color: #222;

        }


        .evidence-container {

            max-width: 1000px;

            margin: 40px auto;

            background: white;

            padding: 30px;

            border-radius: 12px;

            box-shadow: 0 4px 15px rgba(0,0,0,0.08);

        }


        .page-title {

            margin-bottom: 25px;

        }


        .page-title h1 {

            margin: 0;

            font-size: 28px;

        }


        .event-details {

            display: grid;

            grid-template-columns: 1fr 1fr;

            gap: 15px;

            margin-bottom: 30px;

        }


        .detail-card {

            padding: 15px;

            background: #f8f9fc;

            border-radius: 8px;

        }


        .detail-label {

            font-size: 13px;

            color: #777;

            margin-bottom: 5px;

        }


        .detail-value {

            font-size: 16px;

            font-weight: 600;

        }


        .screenshot-section {

            text-align: center;

        }


        .screenshot-section h2 {

            margin-bottom: 20px;

        }


        .screenshot {

            max-width: 100%;

            max-height: 600px;

            border-radius: 8px;

            border: 1px solid #ddd;

        }


        .no-screenshot {

            padding: 50px;

            background: #f5f5f5;

            border-radius: 8px;

            color: #777;

        }


        .back-button {

            display: inline-block;

            margin-top: 25px;

            padding: 10px 18px;

            background: #333;

            color: white;

            text-decoration: none;

            border-radius: 6px;

        }


        @media (max-width: 700px) {

            .event-details {

                grid-template-columns: 1fr;

            }

            .evidence-container {

                margin: 20px;

                padding: 20px;

            }

        }

    </style>

</head>


<body>


<div class="evidence-container">


    <!-- =========================================
         PAGE TITLE
         ========================================= -->

    <div class="page-title">

        <h1>
            EVENT EVIDENCE
        </h1>

    </div>


    <!-- =========================================
         EVENT INFORMATION
         ========================================= -->

    <div class="event-details">


        <div class="detail-card">

            <div class="detail-label">
                Event ID
            </div>

            <div class="detail-value">
                {{ event[0] }}
            </div>

        </div>


        <div class="detail-card">

            <div class="detail-label">
                Candidate ID
            </div>

            <div class="detail-value">
                {{ event[1] }}
            </div>

        </div>


        <div class="detail-card">

            <div class="detail-label">
                Event
            </div>

            <div class="detail-value">
                {{ event[2] }}
            </div>

        </div>


        <div class="detail-card">

            <div class="detail-label">
                Time
            </div>

            <div class="detail-value">
                {{ event[3] }}
            </div>

        </div>


        <div class="detail-card">

            <div class="detail-label">
                Remarks
            </div>

            <div class="detail-value">
                {{ event[4] or "No remarks" }}
            </div>

        </div>


    </div>


    <!-- =========================================
         SCREENSHOT
         ========================================= -->

    <div class="screenshot-section">

        <h2>
            Screenshot
        </h2>


        {% if event[5] %}

            <img
                src="{{ url_for(
                    'exam.view_evidence',
                    filename=event[5].replace(
                        'evidence\\',
                        ''
                    ).replace(
                        '\\',
                        '/'
                    )
                ) }}"
                alt="Event Evidence"
                class="screenshot"
            >

        {% else %}

            <div class="no-screenshot">

                No screenshot is available
                for this event.

            </div>

        {% endif %}


    </div>


    <!-- =========================================
         BACK BUTTON
         ========================================= -->

    <a
        href="{{ url_for('exam.admin_dashboard') }}"
        class="back-button"
    >
        Back to Dashboard
    </a>


</div>


</body>

</html>
