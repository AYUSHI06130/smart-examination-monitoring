<!DOCTYPE html>

<html>

<head>

    <title>Admin Login</title>

    <link rel="stylesheet"
      href="{{ url_for('static',
      filename='css/admin_login.css') }}">

</head>

<body>

<div class="login-container">

    <div class="login-card">

        <h1>Admin Login</h1>

        <form method="POST">

            <input
                type="text"
                name="username"
                placeholder="Username"
                required>

            <input
                type="password"
                name="password"
                placeholder="Password"
                required>

            <button
                type="submit"
                class="login-btn">

                Login

            </button>

        </form>

    </div>

</div>
